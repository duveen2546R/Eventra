<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Event Ticket</title>
    <style>
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        table { border-collapse: collapse !important; }
        body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; }
    </style>
</head>
<body style="margin: 0 !important; padding: 20px !important; background-color: #f4f4f4;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
        <tr>
            <td align="center" style="background-color: #f4f4f4;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                    <!-- Header -->
                    <tr>
                        <td align="center" style="padding: 20px 0; font-size: 28px; font-family: Helvetica, Arial, sans-serif; color: #ffffff; background-color: #28a745;">
                            <b>Your Ticket is Confirmed!</b>
                        </td>
                    </tr>
                    <!-- Main Content -->
                    <tr>
                        <td align="left" style="padding: 40px 30px; background-color: #ffffff;">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td style="font-family: Helvetica, Arial, sans-serif; font-size: 24px; color: #333333; padding-bottom: 20px;">
                                        Hi ${userName}, you're all set!
                                    </td>
                                </tr>
                                <tr>
                                    <td style="font-family: Helvetica, Arial, sans-serif; font-size: 16px; color: #666666; line-height: 24px; padding-bottom: 20px; border-bottom: 1px solid #eeeeee;">
                                        <p>Thank you for registering. Here are the details for your upcoming event.</p>
                                    </td>
                                </tr>
                                <!-- Event Details -->
                                <tr>
                                    <td style="padding-top: 20px;">
                                        <table cellspacing="0" cellpadding="0" border="0" width="100%">
                                            <tr>
                                                <td width="30%" valign="top" style="font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; color: #333333;">Event:</td>
                                                <td width="70%" valign="top" style="font-family: Arial, sans-serif; font-size: 16px; color: #666666;">${eventName}</td>
                                            </tr>
                                            <tr>
                                                <td width="30%" valign="top" style="font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; color: #333333; padding-top: 10px;">Location:</td>
                                                <td width="70%" valign="top" style="font-family: Arial, sans-serif; font-size: 16px; color: #666666; padding-top: 10px;">${eventLocation}</td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                                <!-- QR Code Section -->
                                <tr>
                                    <td align="center" style="padding: 30px 0;">
                                        <p style="font-family: Helvetica, Arial, sans-serif; font-size: 16px; color: #666666; margin-bottom: 20px;">
                                            Present this QR Code at the entrance.
                                        </p>
                                        <img src="cid:qrCode" alt="Your QR Code Ticket" style="width: 200px; max-width: 200px;" />
                                    </td>
                                </tr>
                                <tr>
                                    <td style="font-family: Helvetica, Arial, sans-serif; font-size: 16px; color: #666666; line-height: 24px; text-align: center;">
                                        We look forward to seeing you there!
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding: 20px; font-family: Arial, sans-serif; font-size: 12px; color: #888888;">
                            &copy; 2025 Evantra. All Rights Reserved.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
